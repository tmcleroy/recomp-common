# Every push and pull request: the files are audited (tools/audit.sh), and the tests, the example and the
# launcher (with a stand-in for the game) are built and run on Linux and macOS. Nothing from any game is needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: tools/audit.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tests (the menu's rules; the C interface from C)
        run: make test
      - name: The example host
        run: |
          make example
          build/shot menu.ppm ddddar
          test -s menu.ppm
      - name: The sync script, in a project made for the purpose
        run: |
          mkdir -p /tmp/project/tools
          git -C /tmp/project init -q
          cp tools/sync-common.sh /tmp/project/tools/
          RECOMP_COMMON="$PWD" /tmp/project/tools/sync-common.sh
          RECOMP_COMMON="$PWD" /tmp/project/tools/sync-common.sh --check
          test -f /tmp/project/recomp-common/settings.h
          test -f /tmp/project/recomp-common/launcher/launcher.cmake
          echo "// changed by hand" >> /tmp/project/recomp-common/launcher/src/app.h
          if RECOMP_COMMON="$PWD" /tmp/project/tools/sync-common.sh --check; then echo "a changed copy passed the check"; exit 1; fi
          RECOMP_COMMON="$PWD" /tmp/project/tools/sync-common.sh
          echo "// changed by hand" >> /tmp/project/recomp-common/menu.h
          if RECOMP_COMMON="$PWD" /tmp/project/tools/sync-common.sh --check; then echo "a changed copy passed the check"; exit 1; fi
      - name: The launcher, with a stand-in for the game, and its pages with no display
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgles2-mesa-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev > /dev/null; fi
          make launcher-shots
          build/launcher/example --list-features | grep -q "Off|Player 1|Both"
